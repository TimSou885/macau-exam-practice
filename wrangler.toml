# Cloudflare Workers + Static Assets (production: macau430.com)
# Static files in dist/ (from `npm run build`, including public/ copies) are served
# before SPA fallback when not_found_handling is single-page-application.
name = "macau-exam-practice"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
