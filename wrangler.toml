name = "macau-exam-practice"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/*", "!/assets/*" ]

[[d1_databases]]
binding = "DB"
database_name = "macau-exam-practice"
database_id = "ed391adc-6208-4687-a0df-e18f952f86ae"
migrations_dir = "migrations"

[observability]
enabled = true
